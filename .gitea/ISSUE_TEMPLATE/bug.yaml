name: Bug
description: Something is broken or behaves incorrectly
labels: ["type/bug", "status/needs-info"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Observed problem
      description: What happened, where, and how to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact / risk
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
